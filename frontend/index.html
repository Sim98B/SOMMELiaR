<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SOMMELiaR</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: #1e1510;
            color: #f5eee8;

            display: flex;
            flex-direction: column;
        }

        header {
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #3d2c23;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;

            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            align-self: flex-end;
            background: #6f3f2e;
        }

        .assistant {
            align-self: flex-start;
            background: #30231d;
        }
        .assistant p {
    margin: 0;
}

            .assistant p + p {
                margin-top: 8px;
            }

            .assistant ul,
            .assistant ol {
                margin-top: 4px;
                margin-bottom: 8px;
                padding-left: 22px;
            }

            .assistant li {
                margin-bottom: 2px;
            }

            .assistant h1,
            .assistant h2,
            .assistant h3 {
                margin-top: 12px;
                margin-bottom: 6px;
            }

            .assistant br {
                line-height: 1;
            }

        #input-area {
            display: flex;
            gap: 10px;
            padding: 14px;
            border-top: 1px solid #3d2c23;
        }

        #query {
            flex: 1;
            padding: 12px 14px;
            border: none;
            border-radius: 12px;
            background: #30231d;
            color: #f5eee8;
            font-size: 16px;
            outline: none;
        }

        #send {
            width: 48px;
            border: none;
            border-radius: 12px;
            background: #6f3f2e;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        #send:disabled {
            opacity: 0.5;
            cursor: default;
        }

    </style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <header>
        <h1>🍷 SOMMELiaR</h1>
    </header>

    <main id="chat"></main>

    <div id="input-area">

        <input
            id="query"
            type="text"
            placeholder="Chiedimi qualcosa sul vino..."
            autocomplete="off"
        >

        <button id="send">➤</button>

    </div>

    <script>

        const queryInput = document.getElementById("query");
        const sendButton = document.getElementById("send");
        const chat = document.getElementById("chat");
        let conversationHistory = [];


        function addMessage(text, type) {

            const message = document.createElement("div");

            message.classList.add(
                "message",
                type
            );

            if (type === "assistant") {
                message.innerHTML = marked.parse(text);
            } else {
                message.textContent = text;
            }

            chat.appendChild(message);

            chat.scrollTop = chat.scrollHeight;

            return message;
        }

        addMessage(
            "Ciao! 🍷 Sono **SOMMELiaR**, il tuo sommelier virtuale. " +
            "Posso aiutarti a conoscere un vino, capire un abbinamento " +
            "o guidarti nella degustazione. Cosa vuoi scoprire?",
            "assistant"
        );

        async function sendMessage() {

            const query = queryInput.value.trim();

            if (!query) {
                return;
            }

            queryInput.value = "";

            addMessage(query, "user");

            conversationHistory.push({
                role: "user",
                content: query
            });

            const assistantMessage = addMessage(
                "Sto pensando...",
                "assistant"
            );

            sendButton.disabled = true;
            queryInput.disabled = true;

            try {

                const response = await fetch(
                    "/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            query: query,
                            history: conversationHistory
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            let assistantText = "";

            while (true) {

                const {
                    value,
                    done
                } = await reader.read();

                if (done) {
                    break;
                }

                assistantText += decoder.decode(
                    value,
                    {
                        stream: true
                    }
                );

                const formattedText = assistantText.replace(
                    /\n{3,}/g,
                    "\n\n"
                );

                assistantMessage.innerHTML = marked.parse(
                    formattedText
                );

                chat.scrollTop = chat.scrollHeight;
            }

            conversationHistory.push({
                role: "assistant",
                content: assistantText
            });

            } catch (error) {

                assistantMessage.textContent =
                    "Si è verificato un errore. Riprova.";

                console.error(error);

            } finally {

                sendButton.disabled = false;
                queryInput.disabled = false;

                queryInput.focus();
            }
        }


        sendButton.addEventListener(
            "click",
            sendMessage
        );


        queryInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {
                    event.preventDefault();
                    sendMessage();
                }

            }
        );

    </script>

</body>

</html>
